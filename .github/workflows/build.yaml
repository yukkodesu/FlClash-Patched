name: build

on:
  workflow_dispatch:
    inputs:
      packages:
        description: Build desktop installation packages after validation
        type: boolean
        default: true
      native_acceptance:
        description: Run privileged TUN, Helper and system proxy acceptance on disposable runners
        type: boolean
        default: false
  push:
    branches:
      - '**'
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

env:
  IS_STABLE: ${{ !contains(github.ref, '-') }}
  FLUTTER_VERSION: '3.47.6'

jobs:
  dart-checks:
    name: Dart checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Test commit message hook
        run: bash tool/check_commit_msg_test.sh

      - name: Test comment density hook
        run: bash tool/check_comment_density_test.sh

      - name: Test product uninstall commands
        run: python3 tool/product_uninstall_test.py

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check format
        run: dart format --output=none --set-exit-if-changed lib test tool plugins setup.dart

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Generate release notes
        if: startsWith(github.ref, 'refs/tags/v') && env.IS_STABLE == 'true'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          yq -i '.hooks.user_defines.setup.build_assets = false | .hooks.user_defines.rust_api.build_assets = false' pubspec.yaml
          dart run tool/changelog.dart build
          dart run tool/changelog.dart render --tag "$TAG" --out release.md

      - name: Upload release notes
        if: startsWith(github.ref, 'refs/tags/v') && env.IS_STABLE == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: release.md
          retention-days: 1
          if-no-files-found: error

  dart-tests:
    name: Dart tests (${{ matrix.shard }})
    needs: rust
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Download editor library
        uses: actions/download-artifact@v8
        with:
          name: editor-library-linux
          path: build/editor-library

      - name: Skip native build hooks
        run: |
          yq -i '.hooks.user_defines.setup.build_assets = false | .hooks.user_defines.rust_api.build_assets = false' pubspec.yaml

      - name: Run tests
        env:
          FRB_DART_LOAD_EXTERNAL_LIBRARY_NATIVE_LIB_DIR: ${{ github.workspace }}/build/editor-library
        run: >-
          flutter test --reporter expanded
          --total-shards=${{ strategy.job-total }}
          --shard-index=${{ matrix.shard }}

  plugins:
    name: Plugins
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Validate local Flutter packages
        run: bash tool/check_plugins.sh

      - name: Validate setup hooks package
        working-directory: plugins/setup/setup_hooks
        run: |
          dart pub get
          dart analyze
          dart test

  meow-host:
    name: Meow host (${{ matrix.platform }}/${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: windows, arch: x64, os: windows-2022, triple: x86_64-pc-windows-msvc }
          - { platform: linux, arch: x64, os: ubuntu-22.04, triple: x86_64-unknown-linux-gnu }
          - { platform: macos, arch: arm64, os: macos-26, triple: aarch64-apple-darwin }
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: ${{ matrix.triple }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            core/meow-rs
            services/helper
          key: meow-${{ matrix.triple }}
          cache-on-failure: true
      - uses: ./.github/actions/desktop-native
        with:
          platform: ${{ matrix.platform }}
          triple: ${{ matrix.triple }}
      - name: Check host formatting and lint
        if: matrix.platform == 'linux'
        working-directory: core/meow-rs
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked -p flclash-meow-host -p meow-common --all-targets -- -D warnings
      - name: Test and build host
        working-directory: core/meow-rs
        shell: bash
        run: |
          cargo test --locked -p flclash-meow-host -p meow-common
          cargo build --locked --release -p flclash-meow-host --target ${{ matrix.triple }}
      - name: Windows Helper and uninstall contracts
        if: matrix.platform == 'windows'
        shell: bash
        run: |
          cargo test --locked --manifest-path services/helper/Cargo.toml --features windows-service
          python tool/product_uninstall_test.py
      - name: Elevated Windows caller storage boundary
        if: github.event_name == 'workflow_dispatch' && inputs.native_acceptance && matrix.platform == 'windows'
        working-directory: core/meow-rs
        shell: pwsh
        run: |
          if ($env:RUNNER_ENVIRONMENT -ne 'github-hosted') { throw 'Storage ownership acceptance requires a disposable GitHub-hosted runner.' }
          $identity = [Security.Principal.WindowsIdentity]::GetCurrent()
          $principal = [Security.Principal.WindowsPrincipal]::new($identity)
          if (-not $principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)) { throw 'The runner must already have an elevated token.' }
          cargo test --locked -p meow-common --test managed_files_windows elevated_exact_owner_is_accepted_but_ordinary_caller_rejects_admin_owned_home -- --ignored --exact --nocapture
      - name: Build native rust_api library
        working-directory: plugins/rust_api/rust
        run: cargo build --locked --release --target ${{ matrix.triple }}
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: master
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Prepare real host integration test
        shell: bash
        run: |
          flutter pub get
          python -c "from pathlib import Path; p=Path('pubspec.yaml'); p.write_text(p.read_text().replace('build_assets: true', 'build_assets: false'))"
      - name: Mandatory CoreController integration test
        id: core-e2e
        shell: bash
        env:
          FLCLASH_MEOW_HOST: ${{ github.workspace }}/core/meow-rs/target/${{ matrix.triple }}/release/flclash-meow-host${{ matrix.platform == 'windows' && '.exe' || '' }}
          FRB_DART_LOAD_EXTERNAL_LIBRARY_NATIVE_LIB_DIR: ${{ github.workspace }}/plugins/rust_api/rust/target/${{ matrix.triple }}/release
        run: |
          test -n "$FLCLASH_MEOW_HOST" && test -f "$FLCLASH_MEOW_HOST"
          test -f "$FRB_DART_LOAD_EXTERNAL_LIBRARY_NATIVE_LIB_DIR/${{ matrix.platform == 'windows' && 'rust_api.dll' || (matrix.platform == 'linux' && 'librust_api.so' || 'librust_api.dylib') }}"
          "$FLCLASH_MEOW_HOST" --version
          flutter test test/core/meow_host_integration_test.dart --reporter expanded
      - name: Prepare native Unix system proxy acceptance
        id: proxy-unix-prepare
        if: github.event_name == 'workflow_dispatch' && inputs.native_acceptance && (!cancelled() && matrix.platform != 'windows' && steps.core-e2e.outcome != 'skipped')
        working-directory: plugins/proxy
        shell: bash
        run: |
          test "$GITHUB_ACTIONS" = true && test "$RUNNER_ENVIRONMENT" = github-hosted
          if [[ '${{ matrix.platform }}' == linux ]]; then
            sudo apt-get install -y dbus-x11 dconf-cli dconf-service gsettings-desktop-schemas
          fi
          flutter pub get
      - name: Actual Unix system proxy ownership acceptance
        if: github.event_name == 'workflow_dispatch' && inputs.native_acceptance && (!cancelled() && steps.proxy-unix-prepare.outcome == 'success')
        working-directory: plugins/proxy
        shell: bash
        env:
          FLCLASH_MEOW_PROXY_NATIVE_ACCEPTANCE: '1'
          FLCLASH_MEOW_PROXY_EVIDENCE_PATH: ${{ github.workspace }}/build/native-proxy/${{ matrix.platform }}-${{ matrix.arch }}.json
        run: |
          test "$GITHUB_ACTIONS" = true && test "$RUNNER_ENVIRONMENT" = github-hosted
          mkdir -p "$GITHUB_WORKSPACE/build/native-proxy"
          if [[ '${{ matrix.platform }}' == linux ]]; then
            dbus-run-session -- dart run tool/native_proxy_acceptance.dart
          else
            sudo env GITHUB_ACTIONS="$GITHUB_ACTIONS" RUNNER_ENVIRONMENT="$RUNNER_ENVIRONMENT" \
              FLCLASH_MEOW_PROXY_NATIVE_ACCEPTANCE="$FLCLASH_MEOW_PROXY_NATIVE_ACCEPTANCE" \
              FLCLASH_MEOW_PROXY_EVIDENCE_PATH="$FLCLASH_MEOW_PROXY_EVIDENCE_PATH" \
              "${FLUTTER_ROOT:?}/bin/cache/dart-sdk/bin/dart" run tool/native_proxy_acceptance.dart
          fi
          python -c "import json, os; assert json.load(open(os.environ['FLCLASH_MEOW_PROXY_EVIDENCE_PATH']))['outcome'] == 'passed'"
      - name: Actual Windows system proxy ownership acceptance
        if: github.event_name == 'workflow_dispatch' && inputs.native_acceptance && (!cancelled() && matrix.platform == 'windows' && steps.core-e2e.outcome != 'skipped')
        shell: pwsh
        env:
          FLCLASH_MEOW_PROXY_NATIVE_ACCEPTANCE: '1'
          FLCLASH_MEOW_PROXY_EVIDENCE_PATH: ${{ github.workspace }}/build/native-proxy/${{ matrix.platform }}-${{ matrix.arch }}.json
        run: |
          if ($env:GITHUB_ACTIONS -ne 'true' -or $env:RUNNER_ENVIRONMENT -ne 'github-hosted') { throw 'Native system proxy acceptance requires an opted-in disposable GitHub-hosted runner.' }
          New-Item -ItemType Directory -Force build/native-proxy | Out-Null
          flutter precache --windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $engine = Join-Path $env:FLUTTER_ROOT 'bin/cache/artifacts/engine/windows-x64'
          $proxySource = Join-Path $env:GITHUB_WORKSPACE 'plugins/proxy/windows'
          cmake -S tool/native_proxy_windows -B build/native-proxy/windows -A x64 "-DCMAKE_POLICY_VERSION_MINIMUM=3.5" "-DFLUTTER_ENGINE_DIR=$engine" "-DPROXY_SOURCE_DIR=$proxySource"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build/native-proxy/windows --config Release --target proxy_test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & build/native-proxy/windows/proxy/Release/proxy_test.exe '--gtest_filter=ProxyNativeAcceptance.*'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $evidence = Get-Content -Raw -LiteralPath $env:FLCLASH_MEOW_PROXY_EVIDENCE_PATH | ConvertFrom-Json -AsHashtable
          if ($evidence.outcome -ne 'passed') { throw 'Native system proxy acceptance did not record a passing OS result.' }
      - name: Upload system proxy ownership evidence
        if: github.event_name == 'workflow_dispatch' && inputs.native_acceptance && always()
        uses: actions/upload-artifact@v7
        with:
          name: proxy-native-${{ matrix.platform }}-${{ matrix.arch }}
          path: build/native-proxy/*.json
          if-no-files-found: warn
      - name: Native TUN ownership and crash recovery
        if: github.event_name == 'workflow_dispatch' && inputs.native_acceptance && (!cancelled() && steps.core-e2e.outcome == 'success')
        run: python tool/native_desktop_acceptance.py --log build/native-acceptance/${{ matrix.platform }}-${{ matrix.arch }}.log
      - name: Upload native acceptance evidence
        if: github.event_name == 'workflow_dispatch' && inputs.native_acceptance && always()
        uses: actions/upload-artifact@v7
        with:
          name: native-acceptance-${{ matrix.platform }}-${{ matrix.arch }}
          path: build/native-acceptance
          if-no-files-found: ignore
      - name: Stage hash-coupled production Core and Helper
        id: helper-stage
        if: github.event_name == 'workflow_dispatch' && inputs.native_acceptance && (!cancelled() && steps.core-e2e.outcome == 'success' && matrix.platform != 'macos')
        working-directory: plugins/setup/setup_hooks
        shell: bash
        run: |
          dart pub get
          dart run bin/build_desktop.dart ${{ matrix.platform }} ${{ matrix.arch }}
      - name: Actual privileged Helper lifetime acceptance
        if: github.event_name == 'workflow_dispatch' && inputs.native_acceptance && (!cancelled() && steps.helper-stage.outcome == 'success' && matrix.platform != 'macos')
        shell: bash
        env:
          FRB_DART_LOAD_EXTERNAL_LIBRARY_NATIVE_LIB_DIR: ${{ github.workspace }}/plugins/rust_api/rust/target/${{ matrix.triple }}/release
        run: |
          python tool/privileged_helper_acceptance.py \
            --bundle libclash/${{ matrix.platform }} \
            --log .dart_tool/native-evidence/helper-${{ matrix.platform }}-${{ matrix.arch }}.log
      - name: Upload Helper lifetime evidence
        if: github.event_name == 'workflow_dispatch' && inputs.native_acceptance && (always() && matrix.platform != 'macos')
        uses: actions/upload-artifact@v7
        with:
          name: helper-native-${{ matrix.platform }}-${{ matrix.arch }}
          path: .dart_tool/native-evidence/helper-${{ matrix.platform }}-${{ matrix.arch }}.log
          if-no-files-found: warn

  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            services/helper
            plugins/rust_api/rust

      - name: Check format
        run: |
          cargo fmt --manifest-path services/helper/Cargo.toml -- --check
          cargo fmt --manifest-path plugins/rust_api/rust/Cargo.toml -- --check

      - name: Run tests
        run: |
          cargo test --manifest-path services/helper/Cargo.toml
          cargo test --manifest-path plugins/rust_api/rust/Cargo.toml

      # Dart tests keep the rust_api hook off, so they load this library instead.
      - name: Build the editor library
        run: cargo build --release --manifest-path plugins/rust_api/rust/Cargo.toml

      - name: Upload editor library
        uses: actions/upload-artifact@v7
        with:
          name: editor-library-linux
          path: plugins/rust_api/rust/target/release/librust_api.so
          retention-days: 1
          if-no-files-found: error

  build:
    if: (github.event_name == 'workflow_dispatch' && inputs.packages) || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    needs: [ dart-checks, dart-tests, plugins, meow-host, rust ]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - { platform: windows, os: windows-2022, arch: x64, triple: x86_64-pc-windows-msvc }
          - { platform: windows, os: windows-11-arm, arch: arm64, triple: aarch64-pc-windows-msvc }
          - { platform: linux, os: ubuntu-22.04, arch: x64, triple: x86_64-unknown-linux-gnu }
          - { platform: linux, os: ubuntu-22.04-arm, arch: arm64, triple: aarch64-unknown-linux-gnu }
          - { platform: macos, os: macos-26-intel, arch: x64, triple: x86_64-apple-darwin }
          - { platform: macos, os: macos-26, arch: arm64, triple: aarch64-apple-darwin }
      fail-fast: false

    steps:
      - name: Setup rust
        if: startsWith(matrix.os, 'windows-11-arm')
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://win.rustup.rs/aarch64" -OutFile rustup-init.exe
          .\rustup-init.exe -y --default-toolchain stable
          $cargoPath = "$env:USERPROFILE\.cargo\bin"
          Add-Content $env:GITHUB_PATH $cargoPath

      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup host Rust toolchain
        uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: ${{ matrix.triple }}
      - uses: ./.github/actions/desktop-native
        with:
          platform: ${{ matrix.platform }}
          triple: ${{ matrix.triple }}
      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.platform }}-${{ matrix.arch || 'all' }}
          cache-on-failure: true
          workspaces: |
            services/helper
            core/meow-rs
            plugins/rust_api/rust
          cache-directories: .dart_tool/hooks_runner

      - name: Enable git long paths (Windows)
        if: startsWith(matrix.os, 'windows')
        run: git config --global core.longpaths true

      # Stable publishes no Windows or Linux arm64 archive; master makes the action
      # clone the SDK at the pinned tag and let it fetch the host's own Dart SDK.
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: master
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Setup Xcode
        if: startsWith(matrix.os, 'macos')
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app || sudo xcode-select -s /Applications/Xcode_26.2.app
          xcodebuild -version

      - name: Get Flutter Dependency
        run: |
          flutter --version
          flutter pub get

      - name: Match package version to release tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          release_version="${GITHUB_REF_NAME#v}"
          [[ "$release_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-pre\.[1-9][0-9]*)?$ ]]
          pubspec_version=$(sed -n 's/^version: //p' pubspec.yaml)
          app_version="${pubspec_version%%+*}"
          build_number="${pubspec_version##*+}"
          [[ "${release_version%%-*}" == "${app_version%%-*}" && "$build_number" =~ ^[0-9]+$ ]]
          sed -i "s/^version:.*/version: $release_version+$build_number/" pubspec.yaml

      - name: Setup
        run: dart setup.dart ${{ matrix.platform }} ${{ env.IS_STABLE == 'true' && '--env stable' || '' }} --arch ${{ matrix.arch }} -v
      - name: Smoke staged core
        shell: bash
        run: |
          test -d dist && test -n "$(find dist -type f -print -quit)"
          "libclash/${{ matrix.platform }}/FlClashMeowCore${{ matrix.platform == 'windows' && '.exe' || '' }}" --version
      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: artifact-${{ matrix.platform }}${{ matrix.arch && format('-{0}', matrix.arch) }}
          path: ./dist
          overwrite: true

  upload:
    if: github.repository == 'yukkodesu/FlClash-Patched' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    needs: [ build ]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download
        uses: actions/download-artifact@v8
        with:
          path: ./dist/
          pattern: artifact-*
          merge-multiple: true

      - name: Download release notes
        if: env.IS_STABLE == 'true'
        uses: actions/download-artifact@v8
        with:
          name: release-notes
          path: .

      - name: Patch release.md
        run: |
          if [[ "$IS_STABLE" != true ]]; then
            : > release.md
          fi
          version=$(echo "${{ github.ref_name }}" | sed 's/^v//')
          sed "s|VERSION|$version|g" ./.github/release_template.md >> release.md

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          prerelease: ${{ env.IS_STABLE != 'true' }}
          files: ./dist/*
          body_path: './release.md'
