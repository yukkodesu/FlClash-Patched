name: build
on:
  workflow_dispatch:
    inputs:
      acceptance_build_run:
        type: string
        default: '37374536042'
      packages:
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
jobs:
  frozen-arm64-cold-start:
    runs-on: windows-11-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Verify frozen producer provenance
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN_ID: ${{ inputs.acceptance_build_run }}
        run: |
          set -euo pipefail
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$BUILD_RUN_ID" = 37374536042
          mkdir -p build/arm64-ipc-diagnosis
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN_ID" > build/arm64-ipc-diagnosis/build-run.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          metadata = json.loads(Path('build/arm64-ipc-diagnosis/build-run.json').read_text())
          assert metadata['repository']['full_name'] == metadata['head_repository']['full_name'] == os.environ['GITHUB_REPOSITORY']
          assert metadata['head_sha'] == 'd675cea604e7535f025169da46a7457b54c1376e'
          assert metadata['status'] == 'completed' and metadata['path'] == '.github/workflows/build.yaml'
          PY
          echo 'BUILD_RUN_ID=37374536042' >> "$GITHUB_ENV"
          echo 'BUILD_CLIENT_SHA=d675cea604e7535f025169da46a7457b54c1376e' >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v8
        with:
          name: artifact-windows-arm64
          path: dist
          run-id: ${{ inputs.acceptance_build_run }}
          github-token: ${{ github.token }}
      - uses: subosito/flutter-action@v2
        with:
          channel: master
          flutter-version: '3.47.6'
          cache: true
      - name: Prepare matching old three CoreController tests
        shell: bash
        run: |
          flutter pub get
          python -c "from pathlib import Path; p=Path('pubspec.yaml'); p.write_text(p.read_text().replace('build_assets: true', 'build_assets: false'))"
      - name: Repeat installed ARM64 GUI cold start and exact IPC symptom
        run: python tool/diagnose_arm64_cold_start.py --dist dist --log build/arm64-ipc-diagnosis/diagnosis.jsonl --iterations 25 --seconds 8
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: frozen-arm64-ipc-diagnosis
          path: build/arm64-ipc-diagnosis
          if-no-files-found: error
