name: build

on:
  workflow_dispatch:
    inputs:
      packages:
        description: Build desktop installation packages after validation
        type: boolean
        default: true
      acceptance_build_run:
        description: Accept existing desktop package artifacts from this build run ID; empty runs normal validation/build
        type: string
        default: ''
  push:
    branches:
      - '**'
    tags:
      - 'v*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

env:
  IS_STABLE: ${{ !contains(github.ref, '-') }}
  FLUTTER_VERSION: '3.47.6'

jobs:
  dart-checks:
    if: inputs.acceptance_build_run == ''
    name: Dart checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Test commit message hook
        run: bash tool/check_commit_msg_test.sh

      - name: Test comment density hook
        run: bash tool/check_comment_density_test.sh

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Check format
        run: dart format --output=none --set-exit-if-changed lib test tool plugins setup.dart

      - name: Analyze
        run: flutter analyze --no-fatal-infos

  dart-tests:
    if: inputs.acceptance_build_run == ''
    name: Dart tests (${{ matrix.shard }})
    needs: rust
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Download editor library
        uses: actions/download-artifact@v8
        with:
          name: editor-library-linux
          path: build/editor-library

      - name: Skip native build hooks
        run: |
          yq -i '.hooks.user_defines.setup.build_assets = false | .hooks.user_defines.rust_api.build_assets = false' pubspec.yaml

      - name: Run tests
        env:
          FRB_DART_LOAD_EXTERNAL_LIBRARY_NATIVE_LIB_DIR: ${{ github.workspace }}/build/editor-library
        run: >-
          flutter test --reporter expanded
          --total-shards=${{ strategy.job-total }}
          --shard-index=${{ matrix.shard }}

  plugins:
    if: inputs.acceptance_build_run == ''
    name: Plugins
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Validate local Flutter packages
        run: bash tool/check_plugins.sh

      - name: Validate setup hooks package
        working-directory: plugins/setup/setup_hooks
        run: |
          dart pub get
          dart analyze
          dart test

  meow-host:
    if: inputs.acceptance_build_run == ''
    name: Meow host (${{ matrix.platform }}/${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: windows, arch: amd64, os: windows-2022, triple: x86_64-pc-windows-msvc }
          - { platform: windows, arch: arm64, os: windows-11-arm, triple: aarch64-pc-windows-msvc }
          - { platform: linux, arch: amd64, os: ubuntu-22.04, triple: x86_64-unknown-linux-gnu }
          - { platform: linux, arch: arm64, os: ubuntu-22.04-arm, triple: aarch64-unknown-linux-gnu }
          - { platform: macos, arch: amd64, os: macos-26-intel, triple: x86_64-apple-darwin }
          - { platform: macos, arch: arm64, os: macos-26, triple: aarch64-apple-darwin }
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: ${{ matrix.triple }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core/meow-rs
          key: meow-${{ matrix.triple }}
          cache-on-failure: true
      - uses: ./.github/actions/desktop-native
        with:
          platform: ${{ matrix.platform }}
          triple: ${{ matrix.triple }}
      - name: Validate host
        working-directory: core/meow-rs
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked -p flclash-meow-host -p meow-common --all-targets -- -D warnings
          cargo test --locked -p flclash-meow-host -p meow-common
          cargo build --locked --release -p flclash-meow-host --target ${{ matrix.triple }}
      - name: Elevated Windows caller storage boundary
        if: matrix.platform == 'windows'
        working-directory: core/meow-rs
        shell: pwsh
        run: |
          if ($env:RUNNER_ENVIRONMENT -ne 'github-hosted') { throw 'Storage ownership acceptance requires a disposable GitHub-hosted runner.' }
          $identity = [Security.Principal.WindowsIdentity]::GetCurrent()
          $principal = [Security.Principal.WindowsPrincipal]::new($identity)
          if (-not $principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)) { throw 'The runner must already have an elevated token.' }
          cargo test --locked -p meow-common --test managed_files_windows elevated_exact_owner_is_accepted_but_ordinary_caller_rejects_admin_owned_home -- --ignored --exact --nocapture
      - name: Build native rust_api library
        working-directory: plugins/rust_api/rust
        run: cargo build --locked --release --target ${{ matrix.triple }}
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: master
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Prepare real host integration test
        shell: bash
        run: |
          flutter pub get
          python -c "from pathlib import Path; p=Path('pubspec.yaml'); p.write_text(p.read_text().replace('build_assets: true', 'build_assets: false'))"
      - name: Mandatory CoreController integration test
        id: core-e2e
        shell: bash
        env:
          FLCLASH_MEOW_HOST: ${{ github.workspace }}/core/meow-rs/target/${{ matrix.triple }}/release/flclash-meow-host${{ matrix.platform == 'windows' && '.exe' || '' }}
          FRB_DART_LOAD_EXTERNAL_LIBRARY_NATIVE_LIB_DIR: ${{ github.workspace }}/plugins/rust_api/rust/target/${{ matrix.triple }}/release
        run: |
          test -n "$FLCLASH_MEOW_HOST" && test -f "$FLCLASH_MEOW_HOST"
          test -f "$FRB_DART_LOAD_EXTERNAL_LIBRARY_NATIVE_LIB_DIR/${{ matrix.platform == 'windows' && 'rust_api.dll' || (matrix.platform == 'linux' && 'librust_api.so' || 'librust_api.dylib') }}"
          "$FLCLASH_MEOW_HOST" --version
          flutter test test/core/meow_host_integration_test.dart --reporter expanded
      - name: Native TUN ownership and crash recovery
        run: python tool/native_desktop_acceptance.py --log build/native-acceptance/${{ matrix.platform }}-${{ matrix.arch }}.log
      - name: Upload native acceptance evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: native-acceptance-${{ matrix.platform }}-${{ matrix.arch }}
          path: build/native-acceptance
          if-no-files-found: ignore
      - name: Stage hash-coupled production Core and Helper
        id: helper-stage
        if: always() && steps.core-e2e.outcome == 'success' && matrix.platform != 'macos'
        working-directory: plugins/setup/setup_hooks
        shell: bash
        run: |
          dart pub get
          dart run bin/build_desktop.dart ${{ matrix.platform }} ${{ matrix.arch }}
      - name: Actual privileged Helper lifetime acceptance
        if: always() && steps.helper-stage.outcome == 'success' && matrix.platform != 'macos'
        shell: bash
        env:
          FRB_DART_LOAD_EXTERNAL_LIBRARY_NATIVE_LIB_DIR: ${{ github.workspace }}/plugins/rust_api/rust/target/${{ matrix.triple }}/release
        run: |
          python tool/privileged_helper_acceptance.py \
            --bundle libclash/${{ matrix.platform }} \
            --log .dart_tool/native-evidence/helper-${{ matrix.platform }}-${{ matrix.arch }}.log
      - name: Upload Helper lifetime evidence
        if: always() && matrix.platform != 'macos'
        uses: actions/upload-artifact@v7
        with:
          name: helper-native-${{ matrix.platform }}-${{ matrix.arch }}
          path: .dart_tool/native-evidence/helper-${{ matrix.platform }}-${{ matrix.arch }}.log
          if-no-files-found: warn
  rust:
    if: inputs.acceptance_build_run == ''
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            services/helper
            plugins/rust_api/rust

      - name: Check format
        run: |
          cargo fmt --manifest-path services/helper/Cargo.toml -- --check
          cargo fmt --manifest-path plugins/rust_api/rust/Cargo.toml -- --check

      - name: Run tests
        run: |
          cargo test --manifest-path services/helper/Cargo.toml
          cargo test --manifest-path plugins/rust_api/rust/Cargo.toml

      # Dart tests keep the rust_api hook off, so they load this library instead.
      - name: Build the editor library
        run: cargo build --release --manifest-path plugins/rust_api/rust/Cargo.toml

      - name: Upload editor library
        uses: actions/upload-artifact@v7
        with:
          name: editor-library-linux
          path: plugins/rust_api/rust/target/release/librust_api.so
          retention-days: 1
          if-no-files-found: error

  windows-helper-test:
    if: inputs.acceptance_build_run == ''
    name: Windows helper test
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: services/helper

      - name: Check format
        run: cargo fmt --manifest-path services/helper/Cargo.toml -- --check

      - name: Run Windows service tests
        run: cargo test --manifest-path services/helper/Cargo.toml --features windows-service

  build:
    if: inputs.acceptance_build_run == '' && ((github.event_name == 'workflow_dispatch' && inputs.packages) || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')))
    needs: [ dart-checks, dart-tests, plugins, meow-host, rust, windows-helper-test ]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - { platform: windows, os: windows-2022, arch: amd64, triple: x86_64-pc-windows-msvc }
          - { platform: windows, os: windows-11-arm, arch: arm64, triple: aarch64-pc-windows-msvc }
          - { platform: linux, os: ubuntu-22.04, arch: amd64, triple: x86_64-unknown-linux-gnu }
          - { platform: linux, os: ubuntu-22.04-arm, arch: arm64, triple: aarch64-unknown-linux-gnu }
          - { platform: macos, os: macos-26-intel, arch: amd64, triple: x86_64-apple-darwin }
          - { platform: macos, os: macos-26, arch: arm64, triple: aarch64-apple-darwin }
      fail-fast: false

    steps:
      - name: Setup rust
        if: startsWith(matrix.os, 'windows-11-arm')
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://win.rustup.rs/aarch64" -OutFile rustup-init.exe
          .\rustup-init.exe -y --default-toolchain stable
          $cargoPath = "$env:USERPROFILE\.cargo\bin"
          Add-Content $env:GITHUB_PATH $cargoPath

      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup host Rust toolchain
        uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: ${{ matrix.triple }}
      - uses: ./.github/actions/desktop-native
        with:
          platform: ${{ matrix.platform }}
          triple: ${{ matrix.triple }}
      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.platform }}-${{ matrix.arch || 'all' }}
          cache-on-failure: true
          workspaces: |
            services/helper
            core/meow-rs
            plugins/rust_api/rust
          cache-directories: .dart_tool/hooks_runner

      - name: Enable git long paths (Windows)
        if: startsWith(matrix.os, 'windows')
        run: git config --global core.longpaths true

      # Stable publishes no Windows or Linux arm64 archive; master makes the action
      # clone the SDK at the pinned tag and let it fetch the host's own Dart SDK.
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: master
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Setup Xcode
        if: startsWith(matrix.os, 'macos')
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app || sudo xcode-select -s /Applications/Xcode_26.2.app
          xcodebuild -version

      - name: Get Flutter Dependency
        run: |
          flutter --version
          flutter pub get

      - name: Setup
        run: dart setup.dart ${{ matrix.platform }} ${{ env.IS_STABLE == 'true' && '--env stable' || '' }} --arch ${{ matrix.arch }} -v
      - name: Smoke staged core
        shell: bash
        run: |
          test -d dist && test -n "$(find dist -type f -print -quit)"
          "libclash/${{ matrix.platform }}/FlClashMeowCore${{ matrix.platform == 'windows' && '.exe' || '' }}" --version
      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: artifact-${{ matrix.platform }}${{ matrix.arch && format('-{0}', matrix.arch) }}
          path: ./dist
          overwrite: true

  package-acceptance:
    name: Installed package (${{ matrix.platform }}/${{ matrix.arch }})
    if: github.event_name == 'workflow_dispatch' && inputs.acceptance_build_run != ''
    permissions:
      contents: read
      actions: read
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: windows, os: windows-2022, arch: amd64 }
          - { platform: windows, os: windows-11-arm, arch: arm64 }
          - { platform: linux, os: ubuntu-22.04, arch: amd64 }
          - { platform: linux, os: ubuntu-22.04-arm, arch: arm64 }
          - { platform: macos, os: macos-26-intel, arch: amd64 }
          - { platform: macos, os: macos-26, arch: arm64 }
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Verify artifact build provenance
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN_ID: ${{ inputs.acceptance_build_run }}
        run: |
          [[ "$RUNNER_ENVIRONMENT" == github-hosted ]]
          [[ "$BUILD_RUN_ID" =~ ^[1-9][0-9]*$ ]]
          mkdir -p build/package-acceptance
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$BUILD_RUN_ID" > build/package-acceptance/build-run.json
          BUILD_CLIENT_SHA="$(python - <<'PY'
          import json, os, re
          from pathlib import Path
          metadata = json.loads(Path('build/package-acceptance/build-run.json').read_text())
          repository = os.environ['GITHUB_REPOSITORY']
          if (str(metadata['id']) != os.environ['BUILD_RUN_ID']
              or metadata['repository']['full_name'] != repository
              or metadata['head_repository']['full_name'] != repository
              or metadata['path'] != '.github/workflows/build.yaml'
              or metadata['event'] not in ('push', 'workflow_dispatch')
              or metadata['status'] != 'completed'
              or not re.fullmatch('[0-9a-f]{40}', metadata['head_sha'])):
              raise SystemExit('Rejecting an incomplete, foreign or unexpected artifact build source')
          print(metadata['head_sha'])
          PY
          )"
          git fetch --no-tags origin "$BUILD_CLIENT_SHA"
          test "$(git rev-parse --verify "$BUILD_CLIENT_SHA^{commit}")" = "$BUILD_CLIENT_SHA"
          BUILD_CORE_SHA="$(git rev-parse "$BUILD_CLIENT_SHA:core/meow-rs")"
          [[ "$BUILD_CORE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git ls-tree "$BUILD_CLIENT_SHA" core/meow-rs | cut -d ' ' -f 1)" = 160000
          echo "BUILD_CLIENT_SHA=$BUILD_CLIENT_SHA" >> "$GITHUB_ENV"
          echo "BUILD_CORE_SHA=$BUILD_CORE_SHA" >> "$GITHUB_ENV"
          echo "BUILD_RUN_ID=$BUILD_RUN_ID" >> "$GITHUB_ENV"
      - name: Download the verified build artifact
        uses: actions/download-artifact@v8
        with:
          name: artifact-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist
          run-id: ${{ inputs.acceptance_build_run }}
          github-token: ${{ github.token }}
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: master
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Prepare installed-library CoreController test
        shell: bash
        run: |
          flutter pub get
          python -c "from pathlib import Path; p=Path('pubspec.yaml'); p.write_text(p.read_text().replace('build_assets: true', 'build_assets: false'))"
      - name: Prepare disposable Linux desktop
        if: matrix.platform == 'linux'
        run: sudo apt-get install -y xvfb openbox xdotool scrot dbus-x11 python3-gi libgtk-3-0 libayatana-appindicator3-1
      - name: Install and accept actual artifact
        shell: bash
        env:
          PACKAGE_PLATFORM: ${{ matrix.platform }}
          PACKAGE_ARCH: ${{ matrix.arch }}
        run: |
          if [[ "$PACKAGE_PLATFORM" == linux ]]; then
            dbus-run-session -- xvfb-run -a bash -c 'openbox > /tmp/meow-package-openbox.log 2>&1 & exec /usr/bin/python3 tool/desktop_package_acceptance.py --dist dist --arch "$PACKAGE_ARCH" --source-client "$BUILD_CLIENT_SHA" --source-core "$BUILD_CORE_SHA" --build-run-id "$BUILD_RUN_ID" --log build/package-acceptance/acceptance.jsonl'
          else
            python tool/desktop_package_acceptance.py --dist dist --arch "$PACKAGE_ARCH" --source-client "$BUILD_CLIENT_SHA" --source-core "$BUILD_CORE_SHA" --build-run-id "$BUILD_RUN_ID" --log build/package-acceptance/acceptance.jsonl
          fi
      - name: Upload native package evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: package-native-${{ matrix.platform }}-${{ matrix.arch }}
          path: build/package-acceptance
          if-no-files-found: warn

  upload:
    if: inputs.acceptance_build_run == '' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    needs: [ build ]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download
        uses: actions/download-artifact@v8
        with:
          path: ./dist/
          pattern: artifact-*
          merge-multiple: true

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Skip native build hooks
        run: |
          yq -i '.hooks.user_defines.setup.build_assets = false | .hooks.user_defines.rust_api.build_assets = false' pubspec.yaml

      - name: Generate release notes
        if: env.IS_STABLE == 'true'
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          target=()
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            dart run tool/changelog.dart build
            target=(--tag "$TAG")
          else
            dart run tool/changelog.dart build --unreleased
          fi
          dart run tool/changelog.dart render release "${target[@]}" --out release.md

      - name: Patch release.md
        run: |
          if [[ "$IS_STABLE" != true ]]; then
            : > release.md
          fi
          version=$(echo "${{ github.ref_name }}" | sed 's/^v//')
          sed "s|VERSION|$version|g" ./.github/release_template.md >> release.md

      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          prerelease: ${{ env.IS_STABLE != 'true' }}
          files: ./dist/*
          body_path: './release.md'
