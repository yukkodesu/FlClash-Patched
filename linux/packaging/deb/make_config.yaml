display_name: FlClash-Meow
package_name: flclash-meow
maintainer:
  name: yukkodesu
  email: yukkodesu@users.noreply.github.com

priority: optional
section: net
essential: false
icon: ./assets/images/icon.svg

dependencies:
  - libayatana-appindicator3-1
  - libsecret-1-0

# The Helper unit is written on demand by the app, not at install time, so only
# its teardown belongs here; the binary is already gone when postrm runs.
postuninstall_scripts:
  - 'case "${1:-}" in remove|purge) ;; *) exit 0 ;; esac'
  - 'systemctl disable --now flclash-meow-helper.service >/dev/null 2>&1 || true'
  - 'rm -f /etc/systemd/system/flclash-meow-helper.service'
  - 'systemctl daemon-reload >/dev/null 2>&1 || true'

keywords:
  - FlClash-Meow
  - Clash
  - ClashMeta
  - meow-rs
  - Proxy

supported_mime_type:
  - x-scheme-handler/flclash-meow

generic_name: FlClash-Meow

categories:
  - Network

startup_notify: true
startup_wm_class: com.yukko.flclashmeow
